<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<meta name="robots" content="noindex">
<title>Grand Theft Raki: Новосибирск</title>
<meta property="og:title" content="Grand Theft Raki: Новосибирск 🦀">
<meta property="og:description" content="18 ноября, 23:54. До релиза пять минут. Выбери своего рака.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦀</text></svg>">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#070a14;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:#eef2ff}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
.glass{background:rgba(10,14,26,.62);border:1px solid rgba(255,255,255,.1);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
:root{--pink:#ff3d8a;--cyan:#36e0ff;--gold:#ffc83d;--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}

#loading{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(ellipse at 50% 40%,#16203c,#05070f 70%);transition:opacity .6s}
#loading .crab{font-size:64px;animation:bob 1s ease-in-out infinite alternate}
#loading .bar{width:min(320px,70vw);height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
#loading .bar i{display:block;height:100%;width:30%;background:linear-gradient(90deg,var(--pink),var(--cyan));border-radius:3px;animation:load 1.3s ease-in-out infinite}
#tip{opacity:.7;font-size:14px;text-align:center;padding:0 20px}
@keyframes bob{to{transform:translateY(-10px) rotate(8deg)}}
@keyframes load{0%{transform:translateX(-110%)}100%{transform:translateX(360%)}}

/* ---------- menu ---------- */
#menu{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:space-between;padding:calc(14px + var(--st)) calc(18px + var(--sr)) calc(14px + var(--sb)) calc(18px + var(--sl));pointer-events:none;
  background:linear-gradient(180deg,rgba(5,8,16,.72) 0%,rgba(5,8,16,0) 30%,rgba(5,8,16,0) 52%,rgba(5,8,16,.86) 100%)}
#menu>*{pointer-events:auto}
.logo{line-height:.9;text-transform:uppercase;font-style:italic;font-weight:900;letter-spacing:.02em}
.logo .l1{display:block;font-size:clamp(13px,2.6vmin,22px);letter-spacing:.62em;color:#fff;opacity:.92;text-shadow:0 0 12px rgba(54,224,255,.8)}
.logo .l2{display:block;font-size:clamp(54px,15vmin,132px);color:#fff;text-shadow:0 0 6px #fff,0 0 22px var(--pink),0 0 60px var(--pink),0 0 110px rgba(255,61,138,.6);margin:.02em 0 .06em -.04em}
.logo .l3{display:block;font-style:normal;font-weight:700;font-size:clamp(11px,2.2vmin,17px);letter-spacing:.34em;color:var(--cyan);text-shadow:0 0 14px rgba(54,224,255,.9)}
#mbottom{display:flex;flex-direction:column;gap:10px;align-items:center;width:100%}
#sel{display:flex;align-items:stretch;gap:10px;width:min(680px,100%)}
#sel button{flex:0 0 46px;border-radius:14px;font-size:30px;line-height:1;background:rgba(10,14,26,.62);border:1px solid rgba(255,255,255,.14)}
#sel button:active{background:rgba(255,61,138,.4)}
#card{flex:1;border-radius:16px;padding:10px 16px;min-height:92px}
#cname{font-size:clamp(22px,4.6vmin,34px);font-weight:900;letter-spacing:.01em}
#ctag{color:var(--gold);font-weight:700;font-size:clamp(12px,2.3vmin,15px);margin:1px 0 5px}
#cdesc{font-size:clamp(12px,2.2vmin,14.5px);line-height:1.35;opacity:.86}
#strip{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;max-width:100%}
#strip img{width:clamp(34px,7.2vmin,50px);height:clamp(34px,7.2vmin,50px);border-radius:50%;border:2px solid rgba(255,255,255,.18);opacity:.6;transition:.15s;cursor:pointer;background:#1a2238}
#strip img.on{opacity:1;border-color:var(--pink);box-shadow:0 0 16px var(--pink);transform:scale(1.12)}
#play{padding:14px 34px;border-radius:999px;font-weight:900;font-size:clamp(16px,3.2vmin,21px);letter-spacing:.05em;text-transform:uppercase;color:#fff;
  background:linear-gradient(90deg,#ff3d8a,#ff7a3d);box-shadow:0 0 0 1px rgba(255,255,255,.25) inset,0 8px 34px rgba(255,61,138,.55);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 1px rgba(255,255,255,.25) inset,0 8px 54px rgba(255,61,138,.95)}}
.hint{font-size:11.5px;opacity:.55;text-align:center}

@media (max-height:520px) and (orientation:landscape){
  #menu{flex-direction:row;align-items:stretch;background:linear-gradient(90deg,rgba(5,8,16,.35) 0%,rgba(5,8,16,0) 40%,rgba(5,8,16,.8) 100%)}
  #mbottom{width:54%;justify-content:center;gap:8px}
  .logo .l2{font-size:clamp(40px,13vmin,70px)}
  #card{min-height:0;padding:8px 13px}
  #play{padding:11px 26px}
  .hint{display:none}
}
/* ---------- hud ---------- */
#hud{position:fixed;inset:0;z-index:10;pointer-events:none}
#hud button,#feed{pointer-events:auto}
#top{position:absolute;top:calc(8px + var(--st));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;width:min(560px,56vw)}
#timerbox{padding:5px 18px 6px;border-radius:14px;text-align:center}
#timerbox .lbl{font-size:10px;letter-spacing:.3em;opacity:.7;font-weight:700}
#timer{font-size:clamp(26px,5.2vmin,40px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1;text-shadow:0 0 18px rgba(54,224,255,.7)}
#timer.hot{color:#ff5a6a;text-shadow:0 0 18px rgba(255,61,90,.9);animation:tk .5s steps(2) infinite}
@keyframes tk{50%{opacity:.6}}
#obj{display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;font-size:clamp(12px,2.3vmin,15px);font-weight:700;max-width:100%}
#arrow{display:inline-block;color:var(--gold);font-size:17px;transition:transform .12s linear}
#objtext{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dist{color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
#map{position:absolute;top:calc(8px + var(--st));left:calc(8px + var(--sl));width:clamp(92px,21vmin,150px);height:clamp(92px,21vmin,150px);border-radius:18px;border:1px solid rgba(255,255,255,.16);box-shadow:0 6px 24px rgba(0,0,0,.5)}
#stats{position:absolute;top:calc(8px + var(--st));right:calc(8px + var(--sr));text-align:right;padding:6px 12px;border-radius:14px}
#score{font-size:clamp(20px,4.2vmin,30px);font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1.05}
#coll{font-size:clamp(10.5px,2vmin,13px);opacity:.9;font-variant-numeric:tabular-nums;white-space:nowrap}
#wanted{margin-top:4px;font-size:clamp(10.5px,2vmin,13px);font-weight:800;color:#7db4ff;animation:tk .4s steps(2) infinite}
#btns{position:absolute;right:calc(8px + var(--sr));top:calc(78px + var(--st));display:flex;gap:8px}
#btns button,.tb{width:46px;height:46px;border-radius:50%;font-size:20px;background:rgba(10,14,26,.62);border:1px solid rgba(255,255,255,.16)}
#feed{position:absolute;left:calc(10px + var(--sl));bottom:calc(14px + var(--sb));width:min(330px,44vw);display:flex;flex-direction:column;gap:6px;justify-content:flex-end}
.msg{display:flex;gap:8px;align-items:flex-end;animation:in .25s ease-out,out .5s ease-in 9s forwards}
.msg img{flex:0 0 30px;width:30px;height:30px;border-radius:50%;background:#1a2238}
.msg .b{background:rgba(24,34,54,.9);border-radius:14px 14px 14px 4px;padding:6px 10px 7px;font-size:13.5px;line-height:1.3;max-width:calc(100% - 38px);box-shadow:0 4px 14px rgba(0,0,0,.35);overflow-wrap:anywhere}
.msg .n{font-weight:800;font-size:12px;margin-bottom:1px}
.msg.me{flex-direction:row-reverse}.msg.me .b{background:rgba(43,82,120,.92);border-radius:14px 14px 4px 14px}
.msg.sys{justify-content:center}.msg.sys .b{background:rgba(0,0,0,.5);border-radius:999px;font-size:12px;font-weight:700;color:var(--gold);max-width:100%;text-align:center}
.voice{display:flex;align-items:center;gap:7px;min-width:150px}
.voice .p{width:26px;height:26px;border-radius:50%;background:#4aa3f0;display:grid;place-items:center;font-size:11px;flex:0 0 26px}
.voice .w{flex:1;height:18px;background:repeating-linear-gradient(90deg,#6f8fb5 0 2px,transparent 2px 4px);-webkit-mask:linear-gradient(90deg,#000 0%,#0006 30%,#000 55%,#0004 80%,#000 100%);mask:linear-gradient(90deg,#000 0%,#0006 30%,#000 55%,#0004 80%,#000 100%);border-radius:3px}
.voice .d{font-size:11px;opacity:.7}.voice .u{width:7px;height:7px;border-radius:50%;background:#4aa3f0}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
@keyframes out{to{opacity:0;transform:translateX(-14px)}}
#prompt{position:absolute;left:50%;bottom:calc(22% + var(--sb));transform:translateX(-50%);padding:8px 16px;border-radius:999px;font-weight:800;font-size:14px;white-space:nowrap}
#place{position:absolute;right:calc(14px + var(--sr));bottom:calc(14px + var(--sb));font-size:clamp(15px,3vmin,22px);font-weight:900;font-style:italic;text-align:right;text-shadow:0 2px 12px #000,0 0 22px rgba(54,224,255,.5);opacity:0;transition:opacity .6s;max-width:60vw}
#big{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);text-align:center;font-weight:900;font-style:italic;font-size:clamp(22px,6vmin,46px);text-shadow:0 0 22px var(--pink),0 3px 14px #000;opacity:0;white-space:nowrap}
#big small{display:block;font-size:.5em;color:var(--gold);font-style:normal;text-shadow:0 2px 10px #000}
#big.show{animation:big 2.4s ease-out forwards}
@keyframes big{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}20%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%)}}
#speak{position:absolute;left:50%;top:58%;transform:translateX(-50%);max-width:min(440px,80vw);padding:8px 14px;border-radius:14px;font-size:14px;text-align:center;opacity:0;transition:opacity .3s}
#speak b{color:var(--gold)}

/* touch */
#touch{position:absolute;inset:0;display:none}
.touch #touch{display:block}
#stick{position:absolute;width:128px;height:128px;border-radius:50%;border:2px solid rgba(255,255,255,.22);background:rgba(255,255,255,.05);left:calc(26px + var(--sl));bottom:calc(30px + var(--sb));opacity:.75}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:rgba(255,255,255,.3);border:1px solid rgba(255,255,255,.5)}
#bAct,#bHand{position:absolute;border-radius:50%;background:rgba(10,14,26,.55);border:2px solid rgba(255,255,255,.28);font-weight:900;pointer-events:auto}
#bAct{right:calc(24px + var(--sr));bottom:calc(112px + var(--sb));width:74px;height:74px;font-size:28px}
#bHand{right:calc(108px + var(--sr));bottom:calc(34px + var(--sb));width:66px;height:66px;font-size:12px;letter-spacing:.03em}
#bAct.on,#bHand.on{background:rgba(255,61,138,.5)}
.touch #feed{bottom:auto;top:calc(clamp(92px,21vmin,150px) + 16px + var(--st));width:min(300px,46vw)}
.touch #feed .msg:nth-last-child(n+3){display:none}
.touch #place{bottom:auto;top:calc(134px + var(--st))}
.touch #prompt{bottom:calc(200px + var(--sb))}
@media (orientation:portrait){
  #top{top:calc(clamp(92px,21vmin,150px) + 18px + var(--st));width:94vw}
  .touch #feed{top:auto;bottom:calc(210px + var(--sb));width:min(340px,78vw)}
  #feed{width:min(330px,80vw)}
  #place{bottom:auto;top:calc(134px + var(--st))}
}
@media (max-height:430px) and (orientation:landscape){ #btns{top:calc(66px + var(--st))} #stick{bottom:calc(16px + var(--sb))} #bAct{bottom:calc(92px + var(--sb))} #bHand{bottom:calc(16px + var(--sb))} }

/* phone / modal / final */
#phone{position:fixed;z-index:30;right:calc(10px + var(--sr));top:calc(10px + var(--st));bottom:calc(10px + var(--sb));width:min(380px,calc(100vw - 20px));border-radius:26px;display:flex;flex-direction:column;overflow:hidden;background:#0e1621;border:1px solid rgba(255,255,255,.14);box-shadow:0 20px 70px rgba(0,0,0,.7)}
#phead{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#17212b}
#phead .t{flex:1;min-width:0}#phead .t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#phead .t span{font-size:12px;opacity:.6}
#ppin{padding:7px 14px;font-size:12px;background:#131c26;border-left:3px solid #4aa3f0;opacity:.9}
#plog{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:7px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
#plog .msg{animation:none}
#modal,#final{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(4,6,12,.55)}
#modal .box{width:min(430px,100%);border-radius:22px;padding:18px 20px 20px;text-align:center}
#modal h3{margin:0 0 6px;font-size:21px;font-weight:900}#modal p{margin:0 0 14px;opacity:.85;font-size:14.5px;line-height:1.35}
#mopts{display:flex;flex-direction:column;gap:9px}
#mopts button,.pill{padding:13px 16px;border-radius:14px;font-weight:800;font-size:15.5px;background:linear-gradient(90deg,rgba(255,61,138,.9),rgba(255,122,61,.9))}
#mopts button:nth-child(2){background:linear-gradient(90deg,rgba(54,150,255,.9),rgba(54,224,255,.85))}
#final{background:radial-gradient(ellipse at 50% 30%,rgba(10,14,30,.2),rgba(3,5,10,.82) 75%);flex-direction:column;gap:10px;overflow-y:auto;touch-action:pan-y;justify-content:flex-start;padding-top:calc(14px + var(--st))}
#fclock{font-size:clamp(46px,13vmin,110px);font-weight:900;font-style:italic;line-height:1;text-shadow:0 0 8px #fff,0 0 30px var(--pink),0 0 80px var(--pink)}
#fsub{font-size:clamp(13px,2.6vmin,18px);letter-spacing:.3em;color:var(--cyan);font-weight:800;text-shadow:0 0 14px rgba(54,224,255,.9);text-align:center}
#fchat{width:min(430px,100%);display:flex;flex-direction:column;gap:6px;min-height:0}
#fchat .msg{animation:in .25s ease-out}
#fcard{width:min(460px,100%);border-radius:22px;padding:16px 18px;text-align:center}
#frank{font-size:clamp(22px,5vmin,34px);font-weight:900;color:var(--gold);text-shadow:0 0 18px rgba(255,200,61,.5)}
#fscore{font-size:clamp(34px,8vmin,56px);font-weight:900;line-height:1.1}
#fnote{opacity:.8;font-size:13.5px;margin:2px 0 8px}#fstats{font-size:13px;opacity:.9;line-height:1.5;margin-bottom:12px}
#fbtn{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
.pill.alt{background:rgba(255,255,255,.14)}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:45;transition:opacity .5s}
#err{position:fixed;left:8px;bottom:8px;z-index:99;font:11px monospace;color:#f88;max-width:90vw;white-space:pre-wrap;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="loading"><div class="crab">🦀</div><div class="bar"><i></i></div><div id="tip">Грузим 212 ГБ…</div></div>

<div id="menu" class="hidden">
  <div class="logo"><span class="l1">Grand Theft</span><span class="l2">Raki</span><span class="l3">Новосибирск · 18.11.2026 · 23:54</span></div>
  <div id="mbottom">
    <div id="sel"><button id="prev" aria-label="Назад">‹</button><div id="card" class="glass"><div id="cname"></div><div id="ctag"></div><div id="cdesc"></div></div><button id="next" aria-label="Вперёд">›</button></div>
    <div id="strip"></div>
    <button id="play">Играть</button>
    <div class="hint" id="hint"></div>
  </div>
</div>

<div id="hud" class="hidden">
  <canvas id="map" width="300" height="300"></canvas>
  <div id="top"><div id="timerbox" class="glass"><div class="lbl">ДО РЕЛИЗА</div><div id="timer">06:00</div></div><div id="obj" class="glass"><span id="arrow">▲</span><span id="objtext">Жди сообщений в чате</span><span id="dist"></span></div></div>
  <div id="stats" class="glass"><div id="score">0</div><div id="coll">🃏 0/144 · 🪶 0/6 · 🌸 0/6</div><div id="wanted" class="hidden">🚨 МОДЕРАТОРЫ PS <span id="wt"></span></div></div>
  <div id="btns"><button id="bPhone" aria-label="Чат">💬</button><button id="bMute" aria-label="Звук">🔊</button></div>
  <div id="feed"></div>
  <div id="speak" class="glass"></div>
  <div id="prompt" class="glass hidden"></div>
  <div id="place"></div>
  <div id="big"></div>
  <div id="touch"><div id="stick"><div id="knob"></div></div><button id="bAct">🚪</button><button id="bHand">РУЧНИК</button></div>
</div>

<div id="phone" class="hidden">
  <div id="phead"><div style="font-size:26px">🦀</div><div class="t"><b>DecemRaki 🦀🦀🦀🦀🦀🦀🦀🦀🦀🦀</b><span>11 участников · все ждут</span></div><button class="tb" id="pclose">✕</button></div>
  <div id="ppin">📌 Боже, храни пиратов, аминь</div>
  <div id="plog"></div>
</div>
<div id="modal" class="hidden"><div class="box glass"><h3 id="mtitle"></h3><p id="mtext"></p><div id="mopts"></div></div></div>
<div id="final" class="hidden">
  <div id="fclock">00:00</div><div id="fsub">19 НОЯБРЯ · РЕЛИЗ</div>
  <div id="fchat"></div>
  <div id="fcard" class="glass hidden"><div id="frank"></div><div id="fscore"></div><div id="fnote"></div><div id="fstats"></div>
    <div id="fbtn"><button class="pill" id="fcopy">Скопировать результат</button><button class="pill alt" id="fagain">Ещё раз</button></div></div>
</div>
<div id="fade"></div><div id="err"></div>
<script>window.addEventListener('error',function(e){var d=document.getElementById('err');if(d)d.textContent+=(e.message||e)+'\n';});</script>

</body>
</html>
